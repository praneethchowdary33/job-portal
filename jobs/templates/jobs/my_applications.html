{% extends 'jobs/base.html' %}
{% block content %}
<h3>My Applications</h3>
<table class="table">
    <tr><th>Job</th><th>Company</th><th>Applied on</th><th>Status</th></tr>
    {% for a in applications %}
    <tr>
        <td><a href="{% url 'job_detail' a.job.pk %}">{{ a.job.title }}</a></td>
        <td>{{ a.job.company }}</td>
        <td>{{ a.applied_at|date:"d M Y" }}</td>
        <td><span class="badge bg-info">{{ a.status }}</span></td>
    </tr>
    {% empty %}
    <tr><td colspan="4">No applications yet.</td></tr>
    {% endfor %}
</table>
{% endblock %}
