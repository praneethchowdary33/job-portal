{% extends 'jobs/base.html' %}
{% block content %}
<h3>My Posted Jobs</h3>
<table class="table">
    <tr><th>Title</th><th>Location</th><th>Applicants</th><th></th></tr>
    {% for job in jobs %}
    <tr>
        <td>{{ job.title }}</td>
        <td>{{ job.location }}</td>
        <td>{{ job.applications.count }}</td>
        <td><a class="btn btn-sm btn-primary" href="{% url 'job_applicants' job.pk %}">View Applicants</a></td>
    </tr>
    {% empty %}
    <tr><td colspan="4">No jobs posted yet.</td></tr>
    {% endfor %}
</table>
{% endblock %}
